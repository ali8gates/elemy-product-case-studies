<rect x="1108" y="211" width="184" height="20" rx="10" fill="#f4f1ea"/>
<text x="1116" y="225" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#6b7280">was: Manual handoff</text>
<rect x="1108" y="235" width="184" height="20" rx="10" fill="#c98a0e" opacity="0.14"/>
<text x="1116" y="249" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#c98a0e">now: Handoff with the record</text>

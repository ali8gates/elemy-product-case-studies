<rect x="60" y="660" width="880" height="74" rx="14" fill="#ffffff" stroke="#e7ddcd" stroke-width="2"/>
<text x="82" y="690" font-size="14" font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#1f2933">Stop 2 is the hard one.</text>
<text x="82" y="712" font-size="13.5" font-family="Helvetica, Arial, sans-serif" fill="#6b7280">A family hands over their week before they know the cost or whether they are approved. The ask had to get lighter, not later.</text>
